<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Binomial Distribution Explorer</title>

<style>
body {
    font-family: Arial, Helvetica, sans-serif;
    max-width: 1300px;
    margin: 20px auto;
    padding: 20px;
    background: #f4f6f8;
    color: #333;
}

h1 {
    color: #002E5D;
}

.controls {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 15px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.control-group {
    display: flex;
    flex-direction: column;
}

label {
    margin-bottom: 5px;
    font-weight: bold;
}

input,
select {
    padding: 8px;
    font-size: 16px;
}

button {
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
    font-weight: bold;
}

.run-btn {
    background: #00B140;
}

.run-btn:hover {
    background: #009335;
}

.clear-btn {
    background: #666;
}

.clear-btn:hover {
    background: #444;
}

.results {
    margin-top: 20px;
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit,minmax(220px,1fr));
    gap: 15px;
}

.stat-card {
    padding: 10px;
    border-left: 5px solid #00B140;
    background: #f7fafb;
}

.stat-formula {
    margin-top: 5px;
    color: #555;
    font-size: .9em;
}

canvas {
    margin-top: 20px;
    background: white;
    border-radius: 10px;
    box-shadow: 0 2px 10px rgba(0,0,0,.08);
    width: 100%;
}

.legend {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 15px;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
}

.swatch {
    width: 18px;
    height: 18px;
}

.simulation-stat-swatch {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 24px;
    height: 18px;
}

.simulation-stat-swatch span {
    height: 14px;
    border-left: 2px dashed #1565C0;
}

.simulation-stat-swatch span:first-child {
    border-left: 3px solid #6A1B9A;
}

#tooltip {
    position: fixed;
    display: none;
    background: white;
    border: 1px solid #ccc;
    border-radius: 6px;
    padding: 10px;
    box-shadow: 0 4px 12px rgba(0,0,0,.25);
    pointer-events: none;
    font-size: 14px;
    z-index: 1000;
}

.interpretation {
    margin-top: 15px;
    padding: 15px;
    background: #f8fcff;
    border-radius: 8px;
}

.formula {
    margin-top: 15px;
    font-size: 1.05em;
}

.simulation-status {
    min-height: 1.2em;
    margin-top: 12px;
    color: #555;
}
</style>
</head>

<body>

<h1>Binomial Distribution Explorer</h1>

<div class="controls">

    <div class="control-group">
        <label>Probability of Success (p)</label>
        <input id="p" type="number" min="0" max="1" step="0.01" value="0.50">
    </div>

    <div class="control-group">
        <label>Number of Trials (n)</label>
        <input id="n" type="number" min="1" max="100" value="20">
    </div>

    <div class="control-group">
        <label>Selected Successes (x)</label>
        <select id="x">
            <option value="10">10</option>
        </select>
    </div>

    <div class="control-group">
        <label>Simulation Runs</label>
        <input id="simCount" type="number" min="100" step="100" value="1000">
    </div>

    <div class="control-group">
        <label>&nbsp;</label>
        <button class="run-btn" onclick="runSimulation()">
            Run Simulations
        </button>
    </div>

    <div class="control-group">
        <label>&nbsp;</label>
        <button class="clear-btn" onclick="clearSimulation()">
            Clear Simulations
        </button>
    </div>

</div>

<div class="results">

    <div class="stats-grid">

        <div class="stat-card">
            <strong>Mean (μ)</strong>
            <div id="mean"></div>
            <div class="stat-formula" id="meanFormula"></div>
        </div>

        <div class="stat-card">
            <strong>Standard Deviation (σ)</strong>
            <div id="sd"></div>
            <div class="stat-formula" id="sdFormula"></div>
        </div>

        <div class="stat-card">
            <strong id="probabilityLabel">P(X = 10)</strong>
            <div id="probability"></div>
        </div>

        <div class="stat-card">
            <strong>Typical Range (μ ± σ)</strong>
            <div id="range"></div>
        </div>

    </div>

    <div class="formula" id="formula"></div>
    <div class="simulation-status" id="simulationStatus" aria-live="polite"></div>

    <div class="interpretation" id="interpretation"></div>

</div>

<canvas id="chart" width="1200" height="550"></canvas>

<div class="legend">

    <div class="legend-item">
        <div class="swatch" style="background:#7AA6D8;"></div>
        Theoretical Distribution
    </div>

    <div class="legend-item">
        <div class="swatch" style="background:#AAE5B7;"></div>
        Within 1 Standard Deviation
    </div>

    <div class="legend-item">
        <div class="swatch" style="background:#00B140;"></div>
        Selected Outcome (x)
    </div>

    <div class="legend-item">
        <div class="swatch" style="background:rgba(220,0,0,.60);"></div>
        Simulation Results
    </div>

    <div class="legend-item">
        <div class="simulation-stat-swatch">
            <span></span><span></span><span></span>
        </div>
        Simulated Sample Mean and ±1 Sample Standard Deviation
    </div>

</div>

<div id="tooltip"></div>

<script>

let simulationResults = null;
let simulationRunCount = 0;
let simulationTargetCount = 0;
let simulationRunId = 0;
let simulationTimer = null;
let barData = [];
let hoveredBar = null;

function combination(n, r) {

    if (r > n) return 0;

    r = Math.min(r, n - r);

    let result = 1;

    for (let i = 1; i <= r; i++) {
        result = result * (n - r + i) / i;
    }

    return result;
}

function binomialProbability(n, x, p) {

    return combination(n, x) *
           Math.pow(p, x) *
           Math.pow(1 - p, n - x);
}

function randomBinomial(n, p) {

    let successes = 0;

    for (let i = 0; i < n; i++) {
        if (Math.random() < p) successes++;
    }

    return successes;
}

function clearSimulation() {

    simulationRunId++;
    clearTimeout(simulationTimer);
    simulationTimer = null;
    simulationRunCount = 0;
    simulationTargetCount = 0;
    simulationResults = null;
    setSimulationRunning(false);
    document.getElementById("simulationStatus").textContent =
        "Simulation cleared.";
    update();
}

function runSimulation() {

    if (simulationTimer !== null) return;

    const p =
        parseFloat(document.getElementById("p").value);

    const n =
        parseInt(document.getElementById("n").value);

    const runs =
        parseInt(document.getElementById("simCount").value);

    simulationResults = Array(n + 1).fill(0);
    simulationRunCount = 0;
    simulationTargetCount = runs;
    setSimulationRunning(true);

    const runId = ++simulationRunId;
    const batchSize = Math.max(1, Math.ceil(runs / 60));

    function simulateBatch() {

        if (runId !== simulationRunId) return;

        const batchEnd =
            Math.min(simulationRunCount + batchSize, runs);

        while (simulationRunCount < batchEnd) {

            const result =
                randomBinomial(n, p);

            simulationResults[result]++;
            simulationRunCount++;
        }

        document.getElementById("simulationStatus").textContent =
            `Simulating: ${simulationRunCount.toLocaleString()} / ${runs.toLocaleString()} runs`;

        update();

        if (simulationRunCount < runs) {
            simulationTimer = setTimeout(simulateBatch, 16);
        } else {
            simulationTimer = null;
            setSimulationRunning(false);
            document.getElementById("simulationStatus").textContent =
                `Completed ${runs.toLocaleString()} simulations.`;
        }
    }

    simulateBatch();
}

function setSimulationRunning(isRunning) {

    document.querySelectorAll(".controls input, .controls select")
        .forEach(input => input.disabled = isRunning);

    const runButton =
        document.querySelector(".run-btn");

    runButton.disabled = isRunning;
    runButton.textContent =
        isRunning ? "Running..." : "Run Simulations";
}

function update() {

    const p =
        parseFloat(document.getElementById("p").value);

    const n =
        parseInt(document.getElementById("n").value);

    const xSelect =
        document.getElementById("x");

    const selectedX =
        Number.parseInt(xSelect.value, 10);

    const x =
        Math.min(Number.isNaN(selectedX) ? 0 : selectedX, n);

    if (xSelect.options.length !== n + 1) {
        xSelect.innerHTML =
            Array.from({length: n + 1}, (_, value) =>
                `<option value="${value}">${value}</option>`
            ).join("");
    }

    xSelect.value = String(x);

    const mean = n * p;

    const sd =
        Math.sqrt(
            n * p * (1 - p)
        );

    const probability =
        binomialProbability(n, x, p);

    document.getElementById("probabilityLabel").textContent =
        `P(X = ${x})`;

    document.getElementById("mean").innerHTML =
        mean.toFixed(3);

    document.getElementById("meanFormula").textContent =
        `μ = np = ${n} × ${p.toFixed(2)}`;

    document.getElementById("sd").innerHTML =
        sd.toFixed(3);

    document.getElementById("sdFormula").textContent =
        `σ = √(np(1 − p)) = √(${n} × ${p.toFixed(2)} × ${(1 - p).toFixed(2)})`;

    document.getElementById("probability").innerHTML =
        (probability * 100).toFixed(4) + "%";

    document.getElementById("range").innerHTML =
        `${(mean-sd).toFixed(2)} to ${(mean+sd).toFixed(2)}`;

    document.getElementById("formula").innerHTML =
        `P(X=${x})
        =
        C(${n},${x})
        ×
        (${p})<sup>${x}</sup>
        ×
        (1-${p})<sup>${n-x}</sup>`;

    document.getElementById("interpretation").innerHTML =
        `
        If this experiment were repeated many times,
        the average number of successes would approach
        <strong>${mean.toFixed(2)}</strong>.
        Most outcomes occur between
        <strong>${(mean-sd).toFixed(1)}</strong>
        and
        <strong>${(mean+sd).toFixed(1)}</strong>
        successes.
        `;

    drawDistribution(
        n,p,x,mean,sd
    );

    if (hoveredBar !== null && barData[hoveredBar]) {
        updateTooltip(barData[hoveredBar]);
    }
}

function drawDistribution(
    n,p,selected,mean,sd
){

    const canvas =
        document.getElementById("chart");

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    barData = [];

    const probs = [];

    for(let k=0;k<=n;k++){

        probs.push(
            binomialProbability(
                n,k,p
            )
        );
    }

    let maxProbability =
        Math.max(...probs);

    if(simulationResults && simulationTargetCount > 0){

        const maxSim =
            Math.max(
                ...simulationResults.map(
                    x => x/simulationTargetCount
                )
            );

        maxProbability =
            Math.max(maxProbability, maxSim);
    }

    const left = 100;
    const bottom = 80;

    const chartHeight =
        canvas.height - bottom - 20;

    const targetMaxPercent =
        maxProbability * 100 * 1.1;

    const rawTickStep =
        targetMaxPercent / 5;

    const tickMagnitude =
        10 ** Math.floor(Math.log10(rawTickStep));

    const normalizedTickStep =
        rawTickStep / tickMagnitude;

    const tickFactor =
        normalizedTickStep <= 1 ? 1 :
        normalizedTickStep <= 2 ? 2 :
        normalizedTickStep <= 5 ? 5 : 10;

    const yTickStep =
        Math.max(0.01, tickFactor * tickMagnitude);

    const maxPercent =
        Math.ceil(targetMaxPercent / yTickStep) * yTickStep;

    const maxDisplayValue =
        maxPercent / 100;

    const chartWidth =
        canvas.width - left - 40;

    const barWidth =
        chartWidth / (n + 1);

    const outcomeToX =
        outcome => left + (outcome + 0.5) * barWidth;

    const lowerX =
        outcomeToX(mean - sd);

    const upperX =
        outcomeToX(mean + sd);

    ctx.strokeStyle = "#ececec";
    ctx.lineWidth = 1;
    ctx.font = "12px Arial";
    ctx.textAlign = "right";
    ctx.fillStyle = "black";

    for(let value=0;value<=maxPercent+ yTickStep*0.001;value+=yTickStep){

        const y =
            20 + chartHeight - (value / maxPercent) * chartHeight;

        ctx.beginPath();
        ctx.moveTo(left, y);
        ctx.lineTo(canvas.width - 40, y);
        ctx.stroke();
        ctx.fillText(
            `${Number(value.toPrecision(4))}%`,
            left - 10,
            y + 4
        );
    }

    ctx.fillStyle =
        "rgba(0,177,64,.10)";

    ctx.fillRect(
        lowerX,
        20,
        upperX-lowerX,
        chartHeight
    );

    for(let k=0;k<=n;k++){

        const xPos =
            left +
            k * barWidth;

        const theoryHeight =
            probs[k] /
            maxDisplayValue *
            chartHeight;

        let color =
            "#7AA6D8";

        if(
            k >= mean-sd &&
            k <= mean+sd
        ){
            color =
                "#AAE5B7";
        }

        if(
            k === selected
        ){
            color =
                "#00B140";
        }

        ctx.fillStyle =
            color;

        ctx.fillRect(
            xPos,
            chartHeight-theoryHeight+20,
            barWidth-4,
            theoryHeight
        );

        let simPercent = null;
        let simCount = null;

        if(simulationResults && simulationTargetCount > 0){

            simCount =
                simulationResults[k];

            simPercent =
                simCount /
                simulationTargetCount;

            const simHeight =
                simPercent /
                maxDisplayValue *
                chartHeight;

            ctx.fillStyle =
                "rgba(220,0,0,.60)";

            ctx.fillRect(
                xPos+(barWidth*.25),
                chartHeight-simHeight+20,
                barWidth*.5,
                simHeight
            );
        }

        barData.push({

            k:k,

            x:xPos,

            width:barWidth-4,

            theoretical:
                probs[k] * 100,

            simulated:
                simPercent !== null
                    ? simPercent*100
                    : null,

            count:simCount

        });

        ctx.fillStyle="black";

        ctx.textAlign="center";

        ctx.font="12px Arial";

        ctx.fillText(
            k,
            xPos+(barWidth/2),
            canvas.height-40
        );
    }

    const meanLine =
        outcomeToX(mean);

    ctx.strokeStyle =
        "#004D40";

    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.moveTo(meanLine,20);
    ctx.lineTo(
        meanLine,
        chartHeight+20
    );
    ctx.stroke();

    ctx.fillStyle="#004D40";
    ctx.fillText(
        "μ",
        meanLine,
        15
    );

    ctx.strokeStyle =
        "#FF9800";

    ctx.lineWidth = 2;

    [lowerX,upperX]
    .forEach(x => {

        ctx.beginPath();

        ctx.moveTo(
            x,20
        );

        ctx.lineTo(
            x,
            chartHeight+20
        );

        ctx.stroke();

    });

    ctx.fillStyle =
        "#FF9800";

    ctx.fillText(
        "μ − σ",
        lowerX,
        15
    );

    ctx.fillText(
        "μ + σ",
        upperX,
        15
    );

    if (simulationResults && simulationRunCount > 0) {

        const weightedSum =
            simulationResults.reduce(
                (sum, count, k) => sum + k * count,
                0
            );

        const sampleMean =
            weightedSum / simulationRunCount;

        let sampleSd = null;

        if (simulationRunCount > 1) {

            const squaredDeviationSum =
                simulationResults.reduce(
                    (sum, count, k) =>
                        sum + count * (k - sampleMean) ** 2,
                    0
                );

            sampleSd =
                Math.sqrt(
                    squaredDeviationSum /
                    (simulationRunCount - 1)
                );
        }

        const sampleMeanX =
            outcomeToX(sampleMean);

        ctx.strokeStyle = "#1565C0";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 4]);

        if (sampleSd !== null) {

            [sampleMean - sampleSd, sampleMean + sampleSd]
                .forEach(value => {

                    const x =
                        outcomeToX(value);

                    ctx.beginPath();
                    ctx.moveTo(x, 20);
                    ctx.lineTo(x, chartHeight + 20);
                    ctx.stroke();
                });
        }

        ctx.setLineDash([]);
        ctx.strokeStyle = "#6A1B9A";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(sampleMeanX, 20);
        ctx.lineTo(sampleMeanX, chartHeight + 20);
        ctx.stroke();

        const sampleStatsText =
            `Simulated: x̄ = ${sampleMean.toFixed(2)}, s = ${sampleSd !== null ? sampleSd.toFixed(2) : "—"}`;

        ctx.font = "14px Arial";
        const textWidth =
            ctx.measureText(sampleStatsText).width;

        ctx.fillStyle = "rgba(255,255,255,.9)";
        ctx.fillRect(left + 4, 24, textWidth + 12, 22);

        ctx.fillStyle = "#333";
        ctx.textAlign = "left";
        ctx.fillText(sampleStatsText, left + 10, 40);
    }

    ctx.strokeStyle = "#333";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(left, 20);
    ctx.lineTo(left, chartHeight + 20);
    ctx.lineTo(canvas.width - 40, chartHeight + 20);
    ctx.stroke();

    ctx.save();
    ctx.fillStyle = "#333";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.translate(24, 20 + chartHeight / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText("Percentage of outcomes", 0, 0);
    ctx.restore();

    if(
        hoveredBar !== null &&
        barData[hoveredBar]
    ){

        const center =
            barData[hoveredBar].x +
            (barData[hoveredBar].width/2);

        ctx.strokeStyle =
            "rgba(0,0,0,.3)";

        ctx.lineWidth=1;

        ctx.beginPath();

        ctx.moveTo(
            center,20
        );

        ctx.lineTo(
            center,
            chartHeight+20
        );

        ctx.stroke();
    }
}

const canvas =
    document.getElementById("chart");

const tooltip =
    document.getElementById("tooltip");

function updateTooltip(found) {

    tooltip.style.display = "block";

    let text =
        `<strong>${found.k} Successes</strong><br>
        Theoretical:
        ${found.theoretical.toFixed(4)}%`;

    if (found.simulated !== null) {

        text +=
        `<br>
        Simulated:
        ${found.simulated.toFixed(4)}%
        <br>
        Count:
        ${found.count}
        <br>
        Difference:
        ${(found.simulated - found.theoretical).toFixed(4)}%`;
    }

    tooltip.innerHTML = text;
}

canvas.addEventListener(
    "mousemove",
    e => {

        const rect =
            canvas.getBoundingClientRect();

        const x =
            (e.clientX - rect.left) *
            (canvas.width / rect.width);

        let found = null;
        let index = null;

        for(let i=0;i<barData.length;i++){

            const bar =
                barData[i];

            if(
                x >= bar.x &&
                x <= bar.x + bar.width
            ){
                found = bar;
                index = i;
                break;
            }
        }

        if(!found){

            hoveredBar = null;
            tooltip.style.display="none";
            update();
            return;
        }

        if(
            hoveredBar !== index
        ){

            hoveredBar = index;
            update();
            found = barData[index];
        }

        tooltip.style.left =
            e.clientX + 15 + "px";

        tooltip.style.top =
            e.clientY + 15 + "px";

        updateTooltip(found);
    }
);

canvas.addEventListener(
    "mouseleave",
    () => {

        hoveredBar = null;
        tooltip.style.display =
            "none";

        update();
    }
);

document
.querySelectorAll("input")
.forEach(
    input =>
    input.addEventListener(
        "input",
        update
    )
);

document
.getElementById("x")
.addEventListener(
    "change",
    update
);

update();

</script>

</body>
</html>
