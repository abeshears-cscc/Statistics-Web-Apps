<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Probability Distribution Builder</title>

<style>
:root{
    --green:#00B140;
    --navy:#002E5D;
    --bg:#f4f7fb;
}

body{
    margin:20px;
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--bg);
}

.container{
    max-width:1400px;
    margin:auto;
}

h1,h2{
    color:var(--navy);
}

.panel{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:15px;
    align-items:center;
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

.stat-card{
    background:#eef3f9;
    padding:10px;
    border-radius:10px;
}

button{
    background:var(--green);
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    filter:brightness(.95);
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    border:1px solid #ddd;
    padding:8px;
    text-align:center;
}

th{
    background:var(--navy);
    color:white;
}

input[type=number]{
    width:80px;
}

.slider{
    width:100%;
}

.canvas-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

canvas{
    width:100%;
    height:350px;
    border:1px solid #ddd;
}

.mean-line{
    position:relative;
    height:120px;
}

.axis{
    position:absolute;
    top:60px;
    left:30px;
    right:30px;
    height:4px;
    background:#002E5D;
}

.tick{
    position:absolute;
    width:2px;
    height:16px;
    background:black;
}

.mean-marker{
    position:absolute;
    top:12px;
    color:red;
    font-size:30px;
    transform:translateX(-50%);
}

#sumStatus{
    font-weight:bold;
    font-size:18px;
}
</style>
</head>

<body>

<div class="container">

<h1>Probability Distribution Builder</h1>

<div class="panel">

<div class="controls">

<label>
Outcomes:
<select id="outcomeCount">
<option>3</option>
<option>4</option>
<option selected>5</option>
<option>6</option>
<option>7</option>
<option>8</option>
</select>
</label>

<button onclick="normalizeProbabilities()">
Normalize
</button>

<span id="sumStatus"></span>

</div>

</div>

<div class="panel">

<h2>Distribution Builder</h2>

<table id="distributionTable"></table>

</div>

<div class="panel">

<h2>Statistics</h2>

<div class="stats">

<div class="stat-card">
<b>Mean (μ)</b>
<div id="meanValue">0</div>
</div>

<div class="stat-card">
<b>Variance</b>
<div id="varianceValue">0</div>
</div>

<div class="stat-card">
<b>Std Dev (σ)</b>
<div id="stdValue">0</div>
</div>

<div class="stat-card">
<b>Samples</b>
<div id="sampleCount">0</div>
</div>

</div>

</div>

<div class="panel">

<h2>Expected Value Visualization</h2>

<div class="mean-line">

<div class="axis"></div>

<div id="ticks"></div>

<div id="meanMarker" class="mean-marker">
▲
</div>

</div>

<div style="text-align:center;font-weight:bold;">
μ = <span id="meanLabel">0</span>
</div>

</div>

<div class="panel">

<div class="canvas-row">

<div>
<h2>Theoretical Distribution</h2>
<canvas id="theoryCanvas"
        width="600"
        height="350"></canvas>
</div>

<div>
<h2>Sampling Distribution</h2>
<canvas id="sampleCanvas"
        width="600"
        height="350"></canvas>
</div>

</div>

</div>

<div class="panel">

<h2>Expected Value Contributions</h2>

<table id="contributionTable"></table>

</div>

<div class="panel">

<h2>Sampling Controls</h2>

<button onclick="sampleMany(1)">Sample 1</button>
<button onclick="sampleMany(10)">Sample 10</button>
<button onclick="sampleMany(100)">Sample 100</button>
<button onclick="sampleMany(1000)">Sample 1000</button>
<button onclick="resetSamples()">Reset Samples</button>

</div>

</div>

<script>

let probabilities=[];
let sampleCounts=[];
let totalSamples=0;

function initialize(){

    const n =
        Number(
            document.getElementById("outcomeCount")
            .value
        );

    probabilities=[];

    for(let i=0;i<n;i++){
        probabilities.push(1/n);
    }

    sampleCounts=Array(n).fill(0);

    totalSamples=0;

    buildTable();

    updateAll();
}

function buildTable(){

    const table =
        document.getElementById(
            "distributionTable"
        );

    let html=
    `<tr>
        <th>Outcome</th>
        <th>Probability</th>
        <th>Slider</th>
    </tr>`;

    probabilities.forEach((p,i)=>{

        html += `
        <tr>
            <td>${i}</td>
            <td>
                <input
                    type="number"
                    step=".01"
                    min="0"
                    value="${p.toFixed(2)}"
                    onchange="updateProbability(${i},this.value)">
            </td>
            <td>
                <input
                    class="slider"
                    type="range"
                    min="0"
                    max="1"
                    step=".01"
                    value="${p}"
                    onchange="updateProbability(${i},this.value)">
            </td>
        </tr>`;
    });

    table.innerHTML=html;
}

function updateProbability(index,val){

    probabilities[index]=
        Math.max(0,
        Number(val));

    buildTable();

    updateAll();
}

function normalizeProbabilities(){

    let sum=
    probabilities.reduce((a,b)=>a+b,0);

    if(sum===0) return;

    probabilities=
    probabilities.map(
        p=>p/sum
    );

    buildTable();

    updateAll();
}

function updateAll(){

    updateStatistics();

    drawTheory();

    drawSample();

    buildContributionTable();

    updateMeanDisplay();
}

function updateStatistics(){

    let sum=
    probabilities.reduce((a,b)=>a+b,0);

    const status=
        document.getElementById("sumStatus");

    if(Math.abs(sum-1)<0.001){

        status.innerHTML=
        "✅ Total Probability = "
        +sum.toFixed(3);

    }else{

        status.innerHTML=
        "❌ Total Probability = "
        +sum.toFixed(3);
    }

    let mean=0;

    probabilities.forEach((p,x)=>{

        mean += x*p;

    });

    let variance=0;

    probabilities.forEach((p,x)=>{

        variance +=
        p*Math.pow(x-mean,2);

    });

    document
    .getElementById("meanValue")
    .textContent=
    mean.toFixed(4);

    document
    .getElementById("varianceValue")
    .textContent=
    variance.toFixed(4);

    document
    .getElementById("stdValue")
    .textContent=
    Math.sqrt(
        variance
    ).toFixed(4);

    document
    .getElementById("sampleCount")
    .textContent=
    totalSamples;
}

function buildContributionTable(){

    let mean=0;

    probabilities.forEach((p,x)=>{

        mean += x*p;

    });

    let html=
    `<tr>
      <th>x</th>
      <th>P(x)</th>
      <th>xP(x)</th>
    </tr>`;

    probabilities.forEach((p,x)=>{

        html += `
        <tr>
            <td>${x}</td>
            <td>${p.toFixed(3)}</td>
            <td>${(x*p).toFixed(3)}</td>
        </tr>`;
    });

    html += `
    <tr>
      <th colspan="2">
      Expected Value
      </th>
      <th>
      ${mean.toFixed(3)}
      </th>
    </tr>`;

    document
    .getElementById(
        "contributionTable"
    )
    .innerHTML=html;
}

function updateMeanDisplay(){

    let mean=0;

    probabilities.forEach((p,x)=>{

        mean += x*p;

    });

    const n=
    probabilities.length;

    const width=
    document
      .querySelector(".mean-line")
      .offsetWidth;

    const usable=
    width-60;

    const left=
    30+
    mean/(n-1)*usable;

    document
    .getElementById("meanMarker")
    .style.left=
    left+"px";

    document
    .getElementById("meanLabel")
    .textContent=
    mean.toFixed(3);

    const ticks=
    document.getElementById("ticks");

    let html="";

    for(let i=0;i<n;i++){

        const pos=
            30+
            i/(n-1)*usable;

        html+=`
        <div class='tick'
            style='left:${pos}px;
                   top:54px'></div>

        <div style='position:absolute;
                   left:${pos-5}px;
                   top:75px'>
        ${i}
        </div>`;
    }

    ticks.innerHTML=html;
}

function drawHistogram(
    canvasId,
    values,
    maxVal
){

    const canvas=
        document.getElementById(
            canvasId
        );

    const ctx=
        canvas.getContext("2d");

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    const margin=40;

    const width=
        canvas.width
        -2*margin;

    const height=
        canvas.height
        -2*margin;

    const barWidth=
        width/values.length;

    values.forEach((v,i)=>{

        const h=
            v/maxVal*
            height;

        ctx.fillStyle=
            "#00B140";

        ctx.fillRect(
            margin+i*barWidth+5,
            canvas.height
             -margin-h,
            barWidth-10,
            h
        );

        ctx.fillStyle=
            "#000";

        ctx.fillText(
            i,
            margin+
            i*barWidth+
            barWidth/2,
            canvas.height-15
        );
    });
}

function drawTheory(){

    drawHistogram(
        "theoryCanvas",
        probabilities,
        Math.max(
            ...probabilities,
            .01
        )
    );
}

function drawSample(){

    if(totalSamples===0){

        drawHistogram(
            "sampleCanvas",
            sampleCounts.map(
            ()=>0
            ),
            1
        );

        return;
    }

    const freq=
    sampleCounts.map(
        c=>c/totalSamples
    );

    drawHistogram(
        "sampleCanvas",
        freq,
        Math.max(
            ...probabilities,
            ...freq,
            .01
        )
    );
}

function sampleOne(){

    let r=
        Math.random();

    let cumulative=0;

    for(let i=0;
        i<probabilities.length;
        i++){

        cumulative+=
            probabilities[i];

        if(r<=cumulative){

            sampleCounts[i]++;

            totalSamples++;

            return;
        }
    }
}

function sampleMany(n){

    let sum=
    probabilities.reduce(
        (a,b)=>a+b,0
    );

    if(
      Math.abs(sum-1)
      >0.001
    ){

        alert(
        "Probabilities must sum to 1."
        );

        return;
    }

    for(let i=0;i<n;i++){
        sampleOne();
    }

    updateAll();
}

function resetSamples(){

    sampleCounts=
    Array(
      probabilities.length
    ).fill(0);

    totalSamples=0;

    updateAll();
}

document
.getElementById("outcomeCount")
.addEventListener(
    "change",
    initialize
);

initialize();

</script>

</body>
</html>
