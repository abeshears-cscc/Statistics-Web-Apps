<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Poisson Distribution Simulator</title>

<style>

:root{
    --green:#00B140;
    --navy:#002E5D;
    --forest:#215732;
    --light:#f5f7fa;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:20px;
    font-family:Segoe UI, Arial, sans-serif;
    background:var(--light);
}

h1,h2{
    color:var(--navy);
}

.container{
    max-width:1400px;
    margin:auto;
}

.controls{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
    margin-bottom:20px;
}

input[type="number"]{
    padding:8px;
    width:100px;
}

button{
    border:none;
    color:white;
    background:var(--green);
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
    font-size:15px;
}

button:hover{
    filter:brightness(.93);
}

.stats{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    margin-bottom:20px;
}

.stat-card{
    background:white;
    padding:12px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:20px;
}

.full-width{
    grid-column:1 / span 2;
}

.panel{
    background:white;
    padding:15px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.timeline-container{
    margin-top:20px;
}

.timeline{
    position:relative;
    width:100%;
    height:100px;
}

.timeline-line{
    position:absolute;
    left:0;
    right:0;
    top:50px;
    height:4px;
    background:var(--navy);
}

.timeline-scale{
    display:flex;
    justify-content:space-between;
    font-weight:bold;
    margin-top:8px;
}

.arrival{
    position:absolute;
    top:38px;
    width:24px;
    height:24px;
    border-radius:50%;
    background:var(--green);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    transform:scale(0);
    animation:pop .35s forwards;
}

@keyframes pop{
    0%{
        transform:scale(0);
        opacity:0;
    }
    70%{
        transform:scale(1.25);
    }
    100%{
        transform:scale(1);
        opacity:1;
    }
}

#history{
    max-height:400px;
    overflow-y:auto;
}

.history-item{
    padding:10px;
    border-bottom:1px solid #ddd;
}

canvas{
    width:100%;
    height:450px;
}

table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}

th,td{
    border:1px solid #ddd;
    padding:10px;
    text-align:center;
}

th{
    background:var(--navy);
    color:white;
}

.legend{
    display:flex;
    gap:20px;
    margin-bottom:10px;
}

.legend-item{
    display:flex;
    gap:5px;
    align-items:center;
}

.swatch{
    width:18px;
    height:18px;
}

@media(max-width:1000px){

    .dashboard{
        grid-template-columns:1fr;
    }

    .full-width{
        grid-column:auto;
    }
}

</style>
</head>
<body>

<div class="container">

<h1>Poisson Distribution Simulator</h1>

<div class="controls">

<label>
λ (Average Events)
<input type="number"
       id="lambda"
       min="0.1"
       step="0.1"
       value="4">
</label>

<button id="runOne">Run One Interval</button>
<button id="runTen">Run 10 Intervals</button>
<button id="reset">Reset</button>

<label>
<input type="checkbox"
       id="showTheory"
       checked>
Show Theoretical Distribution
</label>

</div>

<div class="stats">

<div class="stat-card">
<b>Intervals Run</b>
<div id="intervalCount">0</div>
</div>

<div class="stat-card">
<b>Observed Mean</b>
<div id="obsMean">0</div>
</div>

<div class="stat-card">
<b>Theoretical Mean</b>
<div id="theoryMean">0</div>
</div>

<div class="stat-card">
<b>Observed Std Dev</b>
<div id="obsSD">0</div>
</div>

<div class="stat-card">
<b>Theoretical Std Dev</b>
<div id="theorySD">0</div>
</div>

</div>

<div class="dashboard">

<div class="panel full-width">

<h2>Current Interval</h2>

<div id="currentResult">
Press Run One Interval to begin.
</div>

<div class="timeline-container">

<div id="timeline" class="timeline">
<div class="timeline-line"></div>
</div>

<div class="timeline-scale">
<span>0 min</span>
<span>60 min</span>
</div>

</div>

</div>

<div class="panel full-width">

<h2>Histogram</h2>

<div class="legend">

<div class="legend-item">
<div class="swatch" style="background:rgba(220,0,0,.65)"></div>
Observed
</div>

<div class="legend-item">
<div class="swatch" style="background:#4F95FF"></div>
Theoretical
</div>

</div>

<canvas id="chart"
        width="1200"
        height="450"></canvas>

</div>

<div class="panel">

<h2>Interval History</h2>

<div id="history"></div>

</div>

<div class="panel">

<h2>Frequency Table</h2>

<table id="frequencyTable"></table>

</div>

</div>

</div>

<script>

let intervalResults = [];

function sleep(ms){
    return new Promise(r=>setTimeout(r,ms));
}

function poisson(lambda){

    const L = Math.exp(-lambda);

    let k = 0;
    let p = 1;

    do{
        k++;
        p *= Math.random();
    }
    while(p > L);

    return k - 1;
}

function factorial(n){

    let result = 1;

    for(let i=2;i<=n;i++){
        result *= i;
    }

    return result;
}

function poissonProbability(lambda,k){

    return (
        Math.pow(lambda,k)
        *
        Math.exp(-lambda)
    ) / factorial(k);

}

async function animateArrivals(count){

    const timeline =
        document.getElementById("timeline");

    timeline.innerHTML =
        '<div class="timeline-line"></div>';

    let arrivals=[];

    for(let i=0;i<count;i++){
        arrivals.push(Math.random());
    }

    arrivals.sort((a,b)=>a-b);

    for(let i=0;i<arrivals.length;i++){

        await sleep(250);

        const dot =
            document.createElement("div");

        dot.className="arrival";

        dot.innerHTML="•";

        dot.style.left =
            `${arrivals[i]*100}%`;

        timeline.appendChild(dot);
    }
}

async function runInterval(){

    let lambda =
        Number(
            document.getElementById("lambda").value
        );

    let events =
        poisson(lambda);

    await animateArrivals(events);

    intervalResults.push(events);

    document.getElementById("currentResult").innerHTML =
        `<b>Events Observed:</b> ${events}`;

    const history =
        document.getElementById("history");

    const item =
        document.createElement("div");

    item.className =
        "history-item";

    item.innerHTML =
        `<b>Interval ${intervalResults.length}</b>
        <br>
        Events: ${events}`;

    history.prepend(item);

    updateDisplay();
}

async function runTen(){

    document.getElementById("runOne").disabled=true;
    document.getElementById("runTen").disabled=true;

    for(let i=0;i<10;i++){

        await runInterval();

        await sleep(100);
    }

    document.getElementById("runOne").disabled=false;
    document.getElementById("runTen").disabled=false;
}

function updateDisplay(){

    const lambda =
        Number(
            document.getElementById("lambda").value
        );

    document.getElementById("intervalCount")
        .textContent =
        intervalResults.length;

    let mean=0;

    if(intervalResults.length){

        mean =
            intervalResults.reduce(
                (a,b)=>a+b,0
            ) / intervalResults.length;
    }

    let sd=0;

    if(intervalResults.length>1){

        sd=Math.sqrt(

            intervalResults.reduce(
                (sum,x)=>
                    sum+
                    Math.pow(x-mean,2),
                0
            )
            /
            intervalResults.length

        );
    }

    document.getElementById("obsMean")
        .textContent =
        mean.toFixed(3);

    document.getElementById("obsSD")
        .textContent =
        sd.toFixed(3);

    document.getElementById("theoryMean")
        .textContent =
        lambda.toFixed(3);

    document.getElementById("theorySD")
        .textContent =
        Math.sqrt(lambda).toFixed(3);

    buildFrequencyTable();
    drawHistogram();
}

function buildFrequencyTable(){

    const maxObserved =
        Math.max(0,...intervalResults);

    const freq=Array(maxObserved+1).fill(0);

    intervalResults.forEach(v=>freq[v]++);

    let html =
        "<tr><th>Events</th><th>Frequency</th></tr>";

    for(let k=0;k<=maxObserved;k++){

        html +=
            `<tr><td>${k}</td><td>${freq[k]}</td></tr>`;
    }

    document.getElementById("frequencyTable")
        .innerHTML = html;
}

function drawHistogram(){

    const canvas =
        document.getElementById("chart");

    const ctx =
        canvas.getContext("2d");

    ctx.clearRect(
        0,0,
        canvas.width,
        canvas.height
    );

    const lambda =
        Number(
            document.getElementById("lambda").value
        );

    const maxK =
        Math.max(
            12,
            ...intervalResults,
            Math.ceil(lambda*3)
        );

    const freq =
        Array(maxK+1).fill(0);

    intervalResults.forEach(v=>{

        if(v<=maxK){
            freq[v]++;
        }

    });

    const theory=[];

    for(let k=0;k<=maxK;k++){

        theory.push(

            poissonProbability(lambda,k)
            *
            Math.max(
                1,
                intervalResults.length
            )

        );
    }

    const maxDataValue =
        Math.max(
            ...freq,
            ...theory,
            1
        );

    const targetMaxValue =
        maxDataValue * 1.1;

    const rawTickStep =
        targetMaxValue / 5;

    const tickMagnitude =
        10 ** Math.floor(Math.log10(rawTickStep));

    const normalizedTickStep =
        rawTickStep / tickMagnitude;

    const tickFactor =
        normalizedTickStep <= 1 ? 1 :
        normalizedTickStep <= 2 ? 2 :
        normalizedTickStep <= 5 ? 5 : 10;

    const yTickStep =
        Math.max(1, tickFactor * tickMagnitude);

    const maxY =
        Math.ceil(targetMaxValue / yTickStep) * yTickStep;

    const margin=80;
    const width=
        canvas.width - margin*2;

    const height=
        canvas.height - margin - 50;

    const chartTop =
        canvas.height - margin - height;

    const barWidth=
        width/(maxK+1);

    const barInset =
        Math.min(2,barWidth*0.05);

    const visibleBarWidth =
        Math.max(0,barWidth-barInset*2);

    const observedBarWidth =
        visibleBarWidth * 0.72;

    ctx.font="12px Arial";
    ctx.textAlign="right";
    ctx.textBaseline="middle";

    for(let value=0;value<=maxY;value+=yTickStep){

        const y=
            canvas.height-margin-
            (value/maxY)*height;

        ctx.strokeStyle="#ececec";
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(margin,y);
        ctx.lineTo(canvas.width-margin,y);
        ctx.stroke();

        ctx.fillStyle="#000";
        ctx.fillText(value,margin-10,y);
    }

    for(let k=0;k<=maxK;k++){

        const x=
            margin +
            k*barWidth +
            barInset;

        const observedX =
            x + (visibleBarWidth-observedBarWidth)/2;

        const obsHeight=
            (freq[k]/maxY)
            *
            height;

        const theoryHeight=
            (theory[k]/maxY)
            *
            height;

        if(
            document.getElementById("showTheory")
            .checked
        ){

            ctx.fillStyle=
                "rgba(79,149,255,.65)";

            ctx.fillRect(
                x,
                canvas.height-margin-theoryHeight,
                visibleBarWidth,
                theoryHeight
            );
        }

        ctx.fillStyle=
            "rgba(220,0,0,.65)";

        ctx.fillRect(
            observedX,
            canvas.height-margin-obsHeight,
            observedBarWidth,
            obsHeight
        );

        ctx.fillStyle="#000";

        ctx.fillText(
            k,
            x+visibleBarWidth/2,
            canvas.height-margin+18
        );
    }

    ctx.strokeStyle="#000";
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(margin,chartTop);
    ctx.lineTo(margin,canvas.height-margin);
    ctx.lineTo(canvas.width-margin,canvas.height-margin);
    ctx.stroke();

    ctx.fillText(
        "Number of Events",
        canvas.width/2-50,
        canvas.height-10
    );

    ctx.save();
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.translate(22,margin+height/2);
    ctx.rotate(-Math.PI/2);
    ctx.fillText("Frequency",0,0);
    ctx.restore();
}

function resetSimulation(){

    intervalResults=[];

    document.getElementById("history")
        .innerHTML="";

    document.getElementById("currentResult")
        .innerHTML =
        "Press Run One Interval to begin.";

    document.getElementById("timeline")
        .innerHTML=
        '<div class="timeline-line"></div>';

    updateDisplay();
}

document
.getElementById("runOne")
.addEventListener(
    "click",
    runInterval
);

document
.getElementById("runTen")
.addEventListener(
    "click",
    runTen
);

document
.getElementById("reset")
.addEventListener(
    "click",
    resetSimulation
);

document
.getElementById("showTheory")
.addEventListener(
    "change",
    drawHistogram
);

document
.getElementById("lambda")
.addEventListener(
    "change",
    resetSimulation
);

resetSimulation();

</script>

</body>
</html>
